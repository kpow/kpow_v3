<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>og cards</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@500&family=Slackey&display=block" rel="stylesheet" />
<style>
  body { background: #222; color: #ddd; font: 14px Roboto, sans-serif; margin: 16px; }
  .card { margin: 0 0 24px; }
  canvas { width: 600px; height: auto; display: block; border-radius: 8px; }
  canvas.icon { width: 96px; }
</style>
</head>
<body>
<p id="status">drawing…</p>
<div id="out"></div>
<script>
// Each share card: a photo (or a few) full-bleed with the title over a dark
// gradient, a framed photo on an LED-dot field when the only photo is small,
// or an LED-matrix pixel icon when there's no photo. Paths are under client/public.
const W = 1200, H = 630;
const SHOW_STILL = "/remote?u=" + encodeURIComponent("https://kfiles.atl1.cdn.digitaloceanspaces.com/showz/clips/2026-10-07-19-30-48.full.jpg");

const CARDS = [
  { name: "home", kind: "collage", photos: ["images/home-viz/vizbot-desk.jpg", "images/home-viz/vizmac-now-playing.jpg", "images/home-viz/vizspot-cover.jpg"],
    chip: "kpow.xyz", title: "kpow", sub: "LED builds, desk robots, concert clips, Phish stats and what's playing.", accent: "#3b82f6" },
  { name: "builds", kind: "collage", photos: ["buildlog/8x8/media/hero.jpg", "buildlog/noodle/media/noodle-2k-lit.jpg", "buildlog/radar/media/hero.jpg", "buildlog/stackled/media/hero.jpg"],
    chip: "kpow.xyz/builds", title: "build log", sub: "LED instruments, handheld consoles, robots, and the devlog behind them.", accent: "#8b5cf6" },
  { name: "vizbot", kind: "photo", photo: "buildlog/vizbot/media/stackchan-hero.jpg", fx: 0, fy: 0.5,
    chip: "kpow.xyz/vizbot", title: "vizBot", sub: "A tiny desk robot with a face and a personality.", accent: "#a3e635" },
  { name: "vizspot", kind: "photo", photo: "buildlog/vizspot/media/hero.jpg", fx: 0.5, fy: 0.45,
    chip: "kpow.xyz/vizspot", title: "vizSpot", sub: "A 64×64 LED board that shows what Spotify is playing, and dances to it.", accent: "#1db954" },
  { name: "vizmac", kind: "photo", photo: "images/vizmac/media/desk-now-playing.jpg", fx: 0.5, fy: 0.5,
    chip: "kpow.xyz/vizmac", title: "vizMac", sub: "One knob for the whole desk: per-key RGB, Now Playing, a focus timer.", accent: "#f43f5e" },
  { name: "led", kind: "collage", photos: ["images/5x5.jpg", "images/hero-poster.jpg"],
    chip: "kpow.xyz/led", title: "led art", sub: "Pixel grids and bugs that light up, running WLED.", accent: "#f59e0b" },
  { name: "shows", kind: "photo", photo: SHOW_STILL, fx: 0.5, fy: 0.5,
    chip: "kpow.xyz/shows", title: "k-shows", sub: "Every night I pointed a phone at a stage, with the numbers and a map.", accent: "#ef4444" },
  { name: "phashboard", kind: "photo", photo: "buildlog/phantasyfish/media/hero.jpg", fx: 1, fy: 0.35, zoom: 1.15,
    chip: "kpow.xyz/phashboard", title: "phashboard", sub: "Phish shows, setlists, venues and PhantasyFish games.", accent: "#f97316" },
  { name: "about", kind: "inset", photo: "kpow_about.jpg",
    chip: "kpow.xyz/about", title: "about Kevin", sub: "Digital architect, leader and developer.", accent: "#3b82f6" },
  { name: "itunez", kind: "inset", photo: "tunes.jpg",
    chip: "kpow.xyz/itunez", title: "itunez", sub: "Years of plays: top artists, songs and listening habits.", accent: "#ec4899" },
  { name: "pmonk", kind: "inset", photo: "pmonk.jpg",
    chip: "kpow.xyz/pmonk", title: "pmonk", sub: "A gallery of pmonk's work.", accent: "#eab308" },
  { name: "battle", kind: "inset", photo: "battle.jpg",
    chip: "kpow.xyz/battle", title: "battle", sub: "Pick two heroes or villains and let them fight.", accent: "#dc2626" },
  { name: "books", kind: "led", icon: "book",
    chip: "kpow.xyz/books", title: "book feed", sub: "What I'm reading and have read, from Goodreads.", accent: "#10b981" },
  { name: "starred", kind: "led", icon: "star",
    chip: "kpow.xyz/starred-articles", title: "star feed", sub: "Articles worth keeping, starred in my feed reader.", accent: "#facc15" },
  { name: "videos", kind: "led", icon: "play",
    chip: "kpow.xyz/videos", title: "youtubez live", sub: "The latest from the YouTube channels I follow.", accent: "#ef4444" },
  { name: "donuts", kind: "led", icon: "donut",
    chip: "kpow.xyz/donut-tour", title: "donut tour", sub: "Donut shops anywhere, on a map.", accent: "#f472b6" },
];

const params = new URLSearchParams(location.search);
const only = params.get("only");
const dry = params.has("dry");

const load = (src) => new Promise((ok, bad) => {
  const img = new Image();
  img.onload = () => ok(img);
  img.onerror = () => bad(new Error("can't load " + src));
  img.src = src.startsWith("/") ? src : "/public/" + src;
});

/** cover-crop img into (x,y,w,h); fx/fy pick which part survives (0 = left/top). */
function cover(ctx, img, x, y, w, h, fx = 0.5, fy = 0.5, zoom = 1) {
  const s = Math.max(w / img.width, h / img.height) * zoom;
  const sw = w / s, sh = h / s;
  ctx.drawImage(img, (img.width - sw) * fx, (img.height - sh) * fy, sw, sh, x, y, w, h);
}

function wrap(ctx, text, maxW) {
  const words = text.split(" "), lines = [];
  let line = "";
  for (const w of words) {
    const t = line ? line + " " + w : w;
    if (ctx.measureText(t).width > maxW && line) { lines.push(line); line = w; } else line = t;
  }
  if (line) lines.push(line);
  return lines;
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

/** skull + "kpow" top left, chip, title and subtitle bottom left. */
function words(ctx, c, skull, { maxW = 640, bottom = H - 64 } = {}) {
  ctx.drawImage(skull, 56, 48, 68, 67);
  ctx.fillStyle = "#fff";
  ctx.font = "40px Slackey";
  ctx.textBaseline = "alphabetic";
  ctx.fillText("kpow", 140, 96);

  ctx.font = "500 30px Roboto";
  const sub = wrap(ctx, c.sub, maxW).slice(0, 2);
  // shrink the title until its longest word fits beside the picture
  let size = 96;
  const longest = () => Math.max(...c.title.split(" ").map((w) => ctx.measureText(w).width));
  for (ctx.font = `${size}px Slackey`; size > 64 && longest() > maxW; ) ctx.font = `${(size -= 4)}px Slackey`;
  const title = wrap(ctx, c.title, maxW + 60);
  const lh = size + 4, subH = sub.length * 40, titleH = title.length * lh;
  let y = bottom - subH - 18 - titleH;

  // chip
  ctx.font = "500 20px 'Roboto Mono'";
  const label = c.chip.toUpperCase();
  const cw = ctx.measureText(label).width + 28;
  ctx.fillStyle = c.accent;
  roundRect(ctx, 56, y - 44, cw, 36, 6);
  ctx.fill();
  ctx.fillStyle = luminance(c.accent) > 0.5 ? "#000" : "#fff";
  ctx.fillText(label, 70, y - 19);

  ctx.fillStyle = "#fff";
  ctx.font = `${size}px Slackey`;
  ctx.shadowColor = "rgba(0,0,0,.45)";
  ctx.shadowBlur = 18;
  for (const t of title) { y += lh; ctx.fillText(t, 52, y - 14); }
  ctx.font = "500 30px Roboto";
  ctx.fillStyle = "rgba(255,255,255,.92)";
  y += 18;
  for (const s of sub) { y += 40; ctx.fillText(s, 56, y - 8); }
  ctx.shadowBlur = 0;
}

function luminance(hex) {
  const n = parseInt(hex.slice(1), 16);
  return (0.299 * (n >> 16) + 0.587 * ((n >> 8) & 255) + 0.114 * (n & 255)) / 255;
}

function shade(ctx) {
  let g = ctx.createLinearGradient(0, 0, W * 0.75, 0);
  g.addColorStop(0, "rgba(0,0,0,.86)");
  g.addColorStop(0.55, "rgba(0,0,0,.45)");
  g.addColorStop(1, "rgba(0,0,0,0)");
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
  g = ctx.createLinearGradient(0, H * 0.45, 0, H);
  g.addColorStop(0, "rgba(0,0,0,0)");
  g.addColorStop(1, "rgba(0,0,0,.6)");
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
  g = ctx.createLinearGradient(0, 0, 0, 170);
  g.addColorStop(0, "rgba(0,0,0,.55)");
  g.addColorStop(1, "rgba(0,0,0,0)");
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, 170);
}

/** the dim LED-dot field behind inset and icon cards */
function dots(ctx, step = 30, r = 4) {
  ctx.fillStyle = "#09090b";
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = "#1b1b21";
  for (let y = step / 2; y < H; y += step) for (let x = step / 2; x < W; x += step) {
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  }
}

// ---- 16×16 pixel icons for the LED cards: return a color or null per cell
const hash = (x, y) => ((x * 73856093) ^ (y * 19349663)) >>> 0;
const ICONS = {
  donut(x, y, a) {
    const d = Math.hypot(x - 7.5, y - 7.5);
    if (d > 7.3 || d < 2.4) return null;
    if (d > 6.2 || d < 3.3) return "#d9a066";
    const h = hash(x, y) % 9;
    return h === 0 ? "#ffffff" : h === 1 ? "#67e8f9" : h === 2 ? "#fde047" : a;
  },
  star(x, y, a) {
    const pts = [];
    for (let i = 0; i < 10; i++) {
      const r = i % 2 ? 3.2 : 7.6, t = -Math.PI / 2 + (i * Math.PI) / 5;
      pts.push([7.5 + r * Math.cos(t), 8 + r * Math.sin(t)]);
    }
    let inside = false;
    for (let i = 0, j = 9; i < 10; j = i++) {
      const [xi, yi] = pts[i], [xj, yj] = pts[j];
      if (yi > y !== yj > y && x < ((xj - xi) * (y - yi)) / (yj - yi) + xi) inside = !inside;
    }
    return inside ? a : null;
  },
  play(x, y, a) {
    if (y < 3 || y > 12 || x < 1 || x > 14) return null;
    if ((x === 1 || x === 14) && (y === 3 || y === 12)) return null;
    return x >= 5 && x <= 10 && Math.abs(y - 7.5) <= (10.5 - x) * 0.6 ? "#ffffff" : a;
  },
  // three books stacked flat, a label on each spine
  book(x, y, a) {
    const books = [[2, 4, 3, 12, "#f59e0b"], [5, 7, 1, 13, a], [8, 10, 2, 14, "#60a5fa"], [11, 13, 1, 12, "#f43f5e"]];
    for (const [y0, y1, x0, x1, col] of books) {
      if (y < y0 || y > y1 || x < x0 || x > x1) continue;
      return y === y0 + 1 && x >= x0 + 3 && x <= x0 + 6 ? "#ffffff" : col;
    }
    return null;
  },
};

function ledIcon(ctx, icon, accent) {
  const n = 16, size = 520, x0 = W - size - 56, y0 = (H - size) / 2, cell = size / n, r = cell * 0.36;
  ctx.fillStyle = "#000";
  roundRect(ctx, x0 - 20, y0 - 20, size + 40, size + 40, 18);
  ctx.fill();
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
    const col = ICONS[icon](x, y, accent);
    const cx = x0 + cell * (x + 0.5), cy = y0 + cell * (y + 0.5);
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2);
    if (col) { ctx.fillStyle = col; ctx.shadowColor = col; ctx.shadowBlur = 16; }
    else { ctx.fillStyle = "#1d1d24"; ctx.shadowBlur = 0; }
    ctx.fill();
  }
  ctx.shadowBlur = 0;
}

function framed(ctx, img) {
  const maxW = 500, maxH = 400;
  const s = Math.min(maxW / img.width, maxH / img.height, 1.35);
  const w = img.width * s, h = img.height * s, b = 12;
  ctx.save();
  ctx.translate(W - 56 - maxW / 2 - 10, H / 2 + 10);
  ctx.rotate(-0.035);
  ctx.shadowColor = "rgba(0,0,0,.6)"; ctx.shadowBlur = 40; ctx.shadowOffsetY = 12;
  ctx.fillStyle = "#fff";
  ctx.fillRect(-w / 2 - b, -h / 2 - b, w + b * 2, h + b * 2);
  ctx.shadowColor = "transparent";
  ctx.drawImage(img, -w / 2, -h / 2, w, h);
  ctx.restore();
}

async function draw(c, skull) {
  const canvas = document.createElement("canvas");
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext("2d");
  if (c.kind === "photo") {
    cover(ctx, await load(c.photo), 0, 0, W, H, c.fx, c.fy, c.zoom);
    shade(ctx);
    words(ctx, c, skull);
  } else if (c.kind === "collage") {
    const imgs = await Promise.all(c.photos.map(load));
    const gap = 6, cw = (W - gap * (imgs.length - 1)) / imgs.length;
    ctx.fillStyle = "#000"; ctx.fillRect(0, 0, W, H);
    imgs.forEach((img, i) => cover(ctx, img, i * (cw + gap), 0, cw, H));
    shade(ctx);
    words(ctx, c, skull);
  } else if (c.kind === "inset") {
    dots(ctx);
    framed(ctx, await load(c.photo));
    words(ctx, c, skull, { maxW: 500 });
  } else {
    dots(ctx);
    ledIcon(ctx, c.icon, c.accent);
    words(ctx, c, skull, { maxW: 500 });
  }
  return canvas;
}

/** app icons: the skull on black, with room for iOS rounding and Android masks */
function icon(size, skull) {
  const canvas = document.createElement("canvas");
  canvas.width = canvas.height = size;
  const ctx = canvas.getContext("2d");
  ctx.fillStyle = "#000";
  ctx.fillRect(0, 0, size, size);
  const s = size * 0.72;
  ctx.drawImage(skull, (size - s) / 2, (size - s * 73 / 74) / 2, s, s * 73 / 74);
  canvas.className = "icon";
  return canvas;
}

async function save(canvas, file, type = "image/jpeg") {
  const blob = await new Promise((r) => canvas.toBlob(r, type, 0.86));
  if (!dry) await fetch("/save?file=" + encodeURIComponent(file), { method: "POST", body: blob });
}

(async () => {
  await document.fonts.load("96px Slackey");
  await document.fonts.load("500 30px Roboto");
  await document.fonts.load("500 20px 'Roboto Mono'");
  const skull = await load("favicon.svg");
  const out = document.getElementById("out");
  for (const c of CARDS.filter((c) => !only || c.name === only)) {
    const canvas = await draw(c, skull);
    const div = document.createElement("div");
    div.className = "card";
    div.append(c.name, canvas);
    out.append(div);
    await save(canvas, `og/${c.name}.jpg`);
  }
  if (!only) {
    for (const [size, file] of [[180, "apple-touch-icon.png"], [192, "icon-192.png"], [512, "icon-512.png"]]) {
      const canvas = icon(size, skull);
      out.append(canvas);
      await save(canvas, file, "image/png");
    }
  }
  document.getElementById("status").textContent = dry ? "drawn (dry run, nothing saved)" : "done: saved to client/public";
})().catch((e) => (document.getElementById("status").textContent = "failed: " + e.message));
</script>
</body>
</html>
